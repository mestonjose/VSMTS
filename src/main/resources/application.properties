spring.application.name=vsmts
server.port=8080

# ===== MySQL Database Connection =====
# Replace YOUR_PASSWORD with your actual MySQL root password
spring.datasource.url=jdbc:mysql://localhost:3307/vsmts_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# "update" means Spring Boot will auto-create/update tables for you
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
