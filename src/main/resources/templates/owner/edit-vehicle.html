<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Vehicle - DriveLedger</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">DriveLedger</a>
        <div class="navbar-links">
            <a href="/owner/dashboard">Dashboard</a>
            <a href="/owner/vehicles" class="active">My Vehicles</a>
            <a href="/owner/service-history">Service History</a>
            
            <div class="profile-menu">
                <button class="profile-menu-btn">Profile ▼</button>
                <div class="profile-dropdown">
                    <a href="/profile">Account Settings</a>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit">Sign Out</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <div class="form-page-container">
        <div class="form-page-header">
            <h2>Edit Vehicle</h2>
            <p style="color: var(--text-secondary); margin-top: 4px;">Update details for your vehicle.</p>
        </div>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="form-card">
            <form th:action="@{/owner/vehicles/{id}/edit(id=${vehicle.id})}" method="post">
                <div class="form-group">
                    <label for="make">Make</label>
                    <input type="text" id="make" name="make" th:value="${vehicle.make}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="model">Model</label>
                    <input type="text" id="model" name="model" th:value="${vehicle.model}" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" name="year" th:value="${vehicle.year}" class="form-control" min="1900" max="2030" required>
                </div>
                <div class="form-group">
                    <label for="licensePlate">Registration Number</label>
                    <input type="text" id="licensePlate" th:value="${vehicle.licensePlate}" class="form-control" readonly style="background-color: var(--bg-secondary, #f3f4f6); cursor: not-allowed;">
                    <small style="color: var(--text-secondary); font-size: 0.8rem;">Registration number cannot be changed once registered.</small>
                </div>
                <div class="form-group">
                    <label for="color">Color (Optional)</label>
                    <input type="text" id="color" name="color" th:value="${vehicle.color}" class="form-control">
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px;">
                    <div style="display: flex; gap: 12px;">
                        <a href="/owner/vehicles" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Update Vehicle</button>
                    </div>
                </div>
            </form>

            <hr style="border: 0; border-top: 1px solid var(--border-color, #e5e7eb); margin: 24px 0;">

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h4 style="margin: 0; color: #dc2626; font-size: 0.95rem;">Archive this vehicle</h4>
                    <p style="margin: 4px 0 0; color: var(--text-secondary); font-size: 0.85rem;">Hide this vehicle from active tracking while retaining service history.</p>
                </div>
                <form th:action="@{/owner/vehicles/{id}/archive(id=${vehicle.id})}" method="post" onsubmit="return confirm('Are you sure you want to archive this vehicle? It will no longer show in active vehicle lists.');">
                    <button type="submit" class="btn" style="background-color: #fee2e2; color: #dc2626; border: 1px solid #fecaca; font-weight: 500;">Archive Vehicle</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
