<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - DriveLedger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' } }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 font-sans selection:bg-brand-100 selection:text-brand-900">

    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <a th:href="@{/}" class="inline-flex items-center gap-2 mb-6 group">
                <div class="w-10 h-10 rounded-lg bg-brand-600 flex items-center justify-center shadow-md group-hover:bg-brand-700 transition-colors">
                    <i class="fa-solid fa-layer-group text-white text-sm"></i>
                </div>
            </a>
            <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Create your account</h2>
            <p class="mt-2 text-sm text-slate-600">
                Join DriveLedger and start managing your fleet today.
            </p>
        </div>

        <div class="bg-white py-8 px-4 shadow sm:rounded-xl sm:px-10 border border-slate-100">
            
            <div th:if="" class="mb-6 bg-red-50 border border-red-200 rounded-lg p-4 flex gap-3">
                <i class="fa-solid fa-circle-exclamation text-red-500 mt-0.5"></i>
                <p class="text-sm text-red-800" th:text=""></p>
            </div>

            <form th:action="@{/register}" method="post" th:object="" class="space-y-5">
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">I am registering as a:</label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="ROLE_OWNER" class="peer sr-only" required>
                            <div class="p-3 border border-slate-200 rounded-lg text-center peer-checked:border-brand-600 peer-checked:bg-brand-50 peer-checked:ring-1 peer-checked:ring-brand-600 hover:bg-slate-50 transition-all">
                                <i class="fa-solid fa-car text-lg mb-1 block text-slate-400 peer-checked:text-brand-600"></i>
                                <span class="text-sm font-medium text-slate-700 peer-checked:text-brand-700">Vehicle Owner</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="role" value="ROLE_SERVICE_CENTER" class="peer sr-only" required>
                            <div class="p-3 border border-slate-200 rounded-lg text-center peer-checked:border-brand-600 peer-checked:bg-brand-50 peer-checked:ring-1 peer-checked:ring-brand-600 hover:bg-slate-50 transition-all">
                                <i class="fa-solid fa-warehouse text-lg mb-1 block text-slate-400 peer-checked:text-brand-600"></i>
                                <span class="text-sm font-medium text-slate-700 peer-checked:text-brand-700">Service Center</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div>
                    <label for="fullName" class="block text-sm font-medium text-slate-700">Full Name / Business Name</label>
                    <input type="text" id="fullName" name="fullName" required 
                           class="mt-1 appearance-none block w-full px-3 py-2.5 border border-slate-300 rounded-lg placeholder-slate-400 focus:outline-none focus:ring-brand-500 focus:border-brand-500 sm:text-sm">
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700">Email address</label>
                    <input type="email" id="email" name="email" required 
                           class="mt-1 appearance-none block w-full px-3 py-2.5 border border-slate-300 rounded-lg placeholder-slate-400 focus:outline-none focus:ring-brand-500 focus:border-brand-500 sm:text-sm">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
                        <input type="password" id="password" name="password" required 
                               class="mt-1 appearance-none block w-full px-3 py-2.5 border border-slate-300 rounded-lg placeholder-slate-400 focus:outline-none focus:ring-brand-500 focus:border-brand-500 sm:text-sm">
                    </div>
                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-slate-700">Confirm</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required 
                               class="mt-1 appearance-none block w-full px-3 py-2.5 border border-slate-300 rounded-lg placeholder-slate-400 focus:outline-none focus:ring-brand-500 focus:border-brand-500 sm:text-sm">
                    </div>
                </div>

                <button type="submit" 
                        class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-all mt-6">
                    Register Account
                </button>
            </form>

            <div class="mt-6">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-200"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-white text-slate-500">Already have an account?</span>
                    </div>
                </div>
                <div class="mt-6">
                    <a th:href="@{/login}" class="w-full flex justify-center py-2.5 px-4 border border-slate-300 rounded-lg shadow-sm text-sm font-medium text-slate-700 bg-white hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-all">
                        Sign in instead
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
