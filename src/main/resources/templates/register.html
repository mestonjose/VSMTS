<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - DriveLedger</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative">

    <!-- Decorative Background Blobs -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10">
        <div class="absolute top-0 right-0 w-96 h-96 rounded-full bg-brand-100 opacity-50 blur-3xl translate-x-1/3 -translate-y-1/3"></div>
        <div class="absolute bottom-0 left-0 w-80 h-80 rounded-full bg-blue-100 opacity-50 blur-3xl -translate-x-1/2 translate-y-1/4"></div>
    </div>

    <!-- Registration Card -->
    <div x-data="{ loading: false }" class="max-w-lg w-full bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden transform transition-all mt-8 mb-8">
        
        <!-- Header -->
        <div class="bg-slate-900 px-8 py-8 text-center relative overflow-hidden">
            <div class="absolute top-0 right-0 transform translate-x-1/3 -translate-y-1/2 text-white/5">
                <i class="fa-solid fa-car text-9xl"></i>
            </div>
            <div class="relative z-10">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-white/10 mb-3 backdrop-blur-sm">
                    <i class="fa-solid fa-user-plus text-xl text-brand-500"></i>
                </div>
                <h2 class="text-2xl font-bold text-white tracking-tight">Create an account</h2>
                <p class="text-slate-400 mt-1 text-sm">Join DriveLedger as a Vehicle Owner or Service Center</p>
            </div>
        </div>

        <div class="px-8 py-8">
            <form th:action="@{/register}" th:object="${user}" method="post" class="space-y-5" @submit="loading = true">
                
                <!-- Full Name -->
                <div>
                    <label for="fullName" class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-regular fa-id-card text-slate-400"></i>
                        </div>
                        <input id="fullName" type="text" th:field="*{fullName}" required autofocus
                            class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm shadow-sm" 
                            placeholder="John Doe">
                    </div>
                    <p class="mt-1 text-sm text-red-600" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-regular fa-envelope text-slate-400"></i>
                        </div>
                        <input id="email" type="email" th:field="*{email}" required
                            class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm shadow-sm" 
                            placeholder="john@example.com">
                    </div>
                    <p class="mt-1 text-sm text-red-600" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <!-- Password -->
                    <div x-data="{ showPassword: false }">
                        <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-solid fa-lock text-slate-400"></i>
                            </div>
                            <input id="password" :type="showPassword ? 'text' : 'password'" th:field="*{password}" required
                                class="block w-full pl-10 pr-10 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm shadow-sm" 
                                placeholder="••••••••">
                            <button type="button" @click="showPassword = !showPassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                                <i class="fa-regular" :class="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                            </button>
                        </div>
                        <p class="mt-1 text-sm text-red-600" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                    </div>

                    <!-- Confirm Password -->
                    <div x-data="{ showPassword: false }">
                        <label for="confirmPassword" class="block text-sm font-medium text-slate-700 mb-1">Confirm Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-solid fa-lock-check text-slate-400"></i>
                            </div>
                            <input id="confirmPassword" :type="showPassword ? 'text' : 'password'" th:field="*{confirmPassword}" required
                                class="block w-full pl-10 pr-10 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm shadow-sm" 
                                placeholder="••••••••">
                            <button type="button" @click="showPassword = !showPassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                                <i class="fa-regular" :class="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                            </button>
                        </div>
                        <p class="mt-1 text-sm text-red-600" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
                    </div>
                </div>

                <div class="text-xs text-slate-500 bg-slate-50 p-3 rounded-lg border border-slate-100 flex gap-2">
                    <i class="fa-solid fa-circle-info mt-0.5 text-brand-500"></i>
                    <span>Must be at least 8 characters with 1 uppercase, 1 lowercase, 1 number, and 1 special character.</span>
                </div>

                <!-- Account Type -->
                <div>
                    <label for="role" class="block text-sm font-medium text-slate-700 mb-1">Account Type</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-users text-slate-400"></i>
                        </div>
                        <select id="role" th:field="*{role}" required
                            class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm shadow-sm bg-white appearance-none">
                            <option value="Vehicle Owner">Vehicle Owner</option>
                            <option value="Service Center">Service Center</option>
                            <option value="Administrator">Administrator</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-chevron-down text-slate-400 text-xs"></i>
                        </div>
                    </div>
                    <p class="mt-1 text-sm text-red-600" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></p>
                </div>

                <button type="submit" :disabled="loading" 
                    class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-all mt-4 disabled:opacity-70 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-circle-notch fa-spin mr-2" x-show="loading" x-cloak></i>
                    <span x-text="loading ? 'Creating account...' : 'Create Account'"></span>
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-slate-600">
                    Already have an account? 
                    <a th:href="@{/login}" class="font-semibold text-brand-600 hover:text-brand-500 transition-colors">Sign in</a>
                </p>
            </div>
            
            <div class="mt-4 text-center">
                <a th:href="@{/}" class="text-sm text-slate-500 hover:text-slate-700"><i class="fa-solid fa-arrow-left mr-1"></i> Back to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
