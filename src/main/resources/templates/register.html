<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | DriveLedger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neon: { 400: '#34d399', 500: '#10b981' },
                        dark: { 800: '#18181b', 900: '#09090b', 950: '#000000' }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel { background: rgba(24, 24, 27, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-input { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); color: white; }
        .glass-input:focus { border-color: #34d399; background: rgba(52, 211, 153, 0.05); outline: none; }
    </style>
</head>
<body class="bg-dark-950 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <div class="absolute inset-0 w-full h-full">
        <div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-blue-600 rounded-full mix-blend-screen filter blur-[120px] opacity-20"></div>
    </div>

    <div class="w-full max-w-lg glass-panel rounded-3xl p-8 shadow-2xl relative z-10">
        
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-white tracking-tight">Create Identity</h2>
            <p class="text-gray-400 mt-2 text-sm">Join the DriveLedger network.</p>
        </div>

        <!-- Alerts -->
        <div th:if="" class="mb-6 bg-red-500/10 border border-red-500/30 rounded-xl p-4 flex gap-3">
            <i class="fa-solid fa-triangle-exclamation text-red-400 mt-0.5"></i>
            <p class="text-sm text-red-300" th:text=""></p>
        </div>

        <form th:action="@{/register}" method="post" th:object="" class="space-y-5">
            
            <div class="grid grid-cols-2 gap-4">
                <label class="cursor-pointer">
                    <input type="radio" name="role" value="ROLE_OWNER" class="peer sr-only" required>
                    <div class="p-4 rounded-xl glass-input text-center peer-checked:border-neon-400 peer-checked:bg-neon-500/10 transition-all">
                        <i class="fa-solid fa-car text-xl mb-2 block text-gray-400 peer-checked:text-neon-400"></i>
                        <span class="text-sm font-semibold">Vehicle Owner</span>
                    </div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="role" value="ROLE_SERVICE_CENTER" class="peer sr-only" required>
                    <div class="p-4 rounded-xl glass-input text-center peer-checked:border-blue-400 peer-checked:bg-blue-500/10 transition-all">
                        <i class="fa-solid fa-warehouse text-xl mb-2 block text-gray-400 peer-checked:text-blue-400"></i>
                        <span class="text-sm font-semibold">Service Center</span>
                    </div>
                </label>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Full Name / Garage Name</label>
                <input type="text" id="fullName" name="fullName" required class="w-full glass-input rounded-xl py-3 px-4">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Email Address</label>
                <input type="email" id="email" name="email" required class="w-full glass-input rounded-xl py-3 px-4">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Passphrase</label>
                    <input type="password" id="password" name="password" required class="w-full glass-input rounded-xl py-3 px-4">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Confirm</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required class="w-full glass-input rounded-xl py-3 px-4">
                </div>
            </div>

            <button type="submit" class="w-full mt-6 py-4 rounded-xl text-dark-900 font-bold bg-white hover:bg-gray-200 transition-all shadow-[0_0_20px_rgba(255,255,255,0.2)]">
                Provision Account
            </button>
        </form>

        <div class="mt-6 text-center border-t border-white/10 pt-6">
            <p class="text-sm text-gray-400">
                Already registered? <a th:href="@{/login}" class="text-white hover:text-gray-300 font-semibold ml-1">Authenticate here</a>
            </p>
        </div>
    </div>
</body>
</html>
