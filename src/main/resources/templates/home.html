<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveLedger | Advanced Vehicle Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neon: { 400: '#34d399', 500: '#10b981', 600: '#059669' },
                        dark: { 800: '#18181b', 900: '#09090b', 950: '#000000' }
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                        'fade-in': 'fadeIn 1s ease-out forwards'
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .text-gradient {
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-image: linear-gradient(to right, #34d399, #3b82f6);
        }
    </style>
</head>
<body class="bg-dark-950 text-white min-h-screen flex flex-col font-sans overflow-x-hidden relative selection:bg-neon-500 selection:text-white">

    <!-- Ambient Glowing Background Blobs -->
    <div class="fixed inset-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-0 -left-4 w-96 h-96 bg-neon-500 rounded-full mix-blend-screen filter blur-[128px] opacity-20 animate-blob"></div>
        <div class="absolute top-0 -right-4 w-96 h-96 bg-blue-600 rounded-full mix-blend-screen filter blur-[128px] opacity-20 animate-blob animation-delay-2000"></div>
        <div class="absolute -bottom-8 left-1/2 w-96 h-96 bg-purple-600 rounded-full mix-blend-screen filter blur-[128px] opacity-20 animate-blob animation-delay-4000"></div>
    </div>

    <!-- Navigation -->
    <nav class="fixed w-full z-50 glass-panel border-b-0 border-white/10 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-neon-400 to-blue-500 flex items-center justify-center shadow-lg shadow-neon-500/30">
                        <i class="fa-solid fa-bolt text-white text-xl"></i>
                    </div>
                    <span class="font-black text-2xl tracking-tight text-white">Drive<span class="text-neon-400">Ledger</span></span>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="#features" class="text-sm font-medium text-gray-300 hover:text-white transition-colors">Platform</a>
                    <a href="#about" class="text-sm font-medium text-gray-300 hover:text-white transition-colors">Team</a>
                    <a th:href="@{/login}" class="text-sm font-medium text-white hover:text-neon-400 transition-colors">Sign In</a>
                    <a th:href="@{/register}" class="inline-flex items-center justify-center px-6 py-2.5 border border-transparent text-sm font-bold rounded-xl text-dark-900 bg-neon-400 hover:bg-neon-300 transition-all shadow-[0_0_20px_rgba(52,211,153,0.3)] hover:shadow-[0_0_25px_rgba(52,211,153,0.5)] transform hover:-translate-y-0.5">
                        Get Started
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <main class="flex-grow pt-32 pb-16 relative z-10 flex flex-col justify-center min-h-[90vh]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full text-center">
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full glass-panel text-neon-400 text-sm font-medium mb-8 animate-fade-in" style="animation-delay: 0.1s">
                <span class="flex h-2 w-2 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-neon-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-neon-500"></span>
                </span>
                VSMTS Core v2.0 is now live
            </div>
            
            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-8 animate-fade-in leading-tight" style="animation-delay: 0.2s">
                The future of <br/>
                <span class="text-gradient">Vehicle Maintenance.</span>
            </h1>
            
            <p class="mt-4 max-w-2xl mx-auto text-xl text-gray-400 animate-fade-in leading-relaxed" style="animation-delay: 0.3s">
                A highly secure, immutable ledger connecting vehicle owners with service centers. Automate your workflow with role-based precision.
            </p>
            
            <div class="mt-10 flex flex-col sm:flex-row justify-center gap-4 animate-fade-in" style="animation-delay: 0.4s">
                <a th:href="@{/register}" class="px-8 py-4 text-lg font-bold rounded-xl text-dark-900 bg-neon-400 hover:bg-neon-300 transition-all shadow-[0_0_30px_rgba(52,211,153,0.4)] hover:shadow-[0_0_40px_rgba(52,211,153,0.6)] transform hover:-translate-y-1">
                    Start Building Today
                </a>
                <a th:href="@{/login}" class="px-8 py-4 text-lg font-bold rounded-xl text-white glass-panel hover:bg-white/10 transition-all flex items-center justify-center gap-2">
                    Access Dashboard <i class="fa-solid fa-arrow-right text-sm"></i>
                </a>
            </div>
            
            <!-- Dashboard Preview Image -->
            <div class="mt-20 relative mx-auto max-w-5xl animate-fade-in" style="animation-delay: 0.6s">
                <div class="absolute -inset-1 bg-gradient-to-r from-neon-500 to-blue-600 rounded-2xl blur opacity-30"></div>
                <div class="relative glass-panel rounded-2xl p-2 ring-1 ring-white/10">
                    <img src="https://images.unsplash.com/photo-1619767886558-efdc259cde1a?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80" alt="App Preview" class="rounded-xl opacity-80 mix-blend-luminosity hover:mix-blend-normal transition-all duration-700">
                </div>
            </div>
        </div>
    </main>
</body>
</html>
