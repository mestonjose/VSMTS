<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - DriveLedger</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative">

    <!-- Decorative Background Blobs -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10">
        <div class="absolute -top-24 -left-24 w-96 h-96 rounded-full bg-brand-100 opacity-50 blur-3xl"></div>
        <div class="absolute top-1/2 right-0 w-80 h-80 rounded-full bg-blue-100 opacity-50 blur-3xl translate-x-1/2"></div>
    </div>

    <!-- Forgot Password Card -->
    <div x-data="{ loading: false }" class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden transform transition-all">
        
        <!-- Header -->
        <div class="bg-slate-900 px-8 py-10 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-white/10 mb-4 backdrop-blur-sm">
                <i class="fa-solid fa-key text-2xl text-brand-500"></i>
            </div>
            <h2 class="text-3xl font-bold text-white tracking-tight">Forgot Password</h2>
            <p class="text-slate-400 mt-2 text-sm">Enter your email to receive a password reset link</p>
        </div>

        <div class="px-8 py-10">
            <!-- Success Alert -->
            <div th:if="${success}" x-data="{ show: true }" x-show="show" class="mb-6 bg-green-50 border border-green-200 rounded-lg p-4 flex items-start gap-3">
                <i class="fa-solid fa-circle-check text-green-500 mt-0.5"></i>
                <div class="flex-1">
                    <h3 class="text-sm font-medium text-green-800">Email Sent!</h3>
                    <p class="text-sm text-green-600 mt-1" th:text="${success}"></p>
                </div>
                <button @click="show = false" class="text-green-400 hover:text-green-500"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Error Alert -->
            <div th:if="${error}" x-data="{ show: true }" x-show="show" class="mb-6 bg-red-50 border border-red-200 rounded-lg p-4 flex items-start gap-3">
                <i class="fa-solid fa-circle-exclamation text-red-500 mt-0.5"></i>
                <div class="flex-1">
                    <h3 class="text-sm font-medium text-red-800">Error</h3>
                    <p class="text-sm text-red-600 mt-1" th:text="${error}"></p>
                </div>
                <button @click="show = false" class="text-red-400 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- Forgot Password Form -->
            <form th:action="@{/forgot-password}" method="post" class="space-y-6" @submit="loading = true">
                
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-regular fa-envelope text-slate-400"></i>
                        </div>
                        <input id="email" name="email" type="email" required autofocus
                            class="block w-full pl-10 pr-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm transition-shadow shadow-sm" 
                            placeholder="Enter your registered email">
                    </div>
                </div>

                <button type="submit" :disabled="loading" 
                    class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-all disabled:opacity-70 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-circle-notch fa-spin mr-2" x-show="loading" x-cloak></i>
                    <span x-text="loading ? 'Sending...' : 'Send Reset Link'"></span>
                </button>
            </form>

            <div class="mt-8 text-center">
                <a th:href="@{/login}" class="text-sm font-medium text-brand-600 hover:text-brand-500 transition-colors">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Back to Login
                </a>
            </div>
        </div>
    </div>
</body>
</html>
