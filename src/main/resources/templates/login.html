<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | DriveLedger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neon: { 400: '#34d399', 500: '#10b981' },
                        dark: { 800: '#18181b', 900: '#09090b', 950: '#000000' }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel { background: rgba(24, 24, 27, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-input { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); color: white; }
        .glass-input:focus { border-color: #34d399; background: rgba(52, 211, 153, 0.05); outline: none; }
    </style>
</head>
<body class="bg-dark-950 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- Abstract Background -->
    <div class="absolute inset-0 w-full h-full">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-neon-500 rounded-full mix-blend-screen filter blur-[100px] opacity-20"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-600 rounded-full mix-blend-screen filter blur-[100px] opacity-20"></div>
    </div>

    <!-- Login Container -->
    <div x-data="{ loading: false }" class="w-full max-w-md glass-panel rounded-3xl p-8 shadow-2xl relative z-10 transform transition-all">
        
        <div class="text-center mb-10">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-neon-400 to-blue-500 mx-auto flex items-center justify-center shadow-lg shadow-neon-500/30 mb-6">
                <i class="fa-solid fa-fingerprint text-3xl text-white"></i>
            </div>
            <h2 class="text-3xl font-bold text-white tracking-tight">Secure Access</h2>
            <p class="text-gray-400 mt-2 text-sm">Authenticate to enter the DriveLedger core.</p>
        </div>

        <!-- Spring Security Alerts -->
        <div th:if="" class="mb-6 bg-red-500/10 border border-red-500/30 rounded-xl p-4 flex gap-3 backdrop-blur-sm">
            <i class="fa-solid fa-circle-exclamation text-red-400 mt-0.5"></i>
            <div>
                <h3 class="text-sm font-semibold text-red-400">Access Denied</h3>
                <p class="text-xs text-red-300 mt-1">Invalid credentials. Security protocols activated.</p>
            </div>
        </div>

        <form th:action="@{/login}" method="post" class="space-y-5" @submit="loading = true">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Email Identity</label>
                <div class="relative">
                    <i class="fa-regular fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input id="email" name="email" type="email" required autofocus
                        class="w-full glass-input rounded-xl py-3.5 pl-12 pr-4 transition-all" 
                        placeholder="admin@driveledger.com">
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Passphrase</label>
                    <a href="#" class="text-xs text-neon-400 hover:text-neon-300">Recover key?</a>
                </div>
                <div class="relative" x-data="{ show: false }">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input id="password" name="password" :type="show ? 'text' : 'password'" required
                        class="w-full glass-input rounded-xl py-3.5 pl-12 pr-12 transition-all" 
                        placeholder="••••••••••••">
                    <button type="button" @click="show = !show" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300">
                        <i class="fa-regular" :class="show ? 'fa-eye-slash' : 'fa-eye'"></i>
                    </button>
                </div>
            </div>

            <button type="submit" :disabled="loading" 
                class="w-full mt-4 py-4 rounded-xl text-dark-900 font-bold bg-neon-400 hover:bg-neon-300 transition-all shadow-[0_0_20px_rgba(52,211,153,0.2)] hover:shadow-[0_0_30px_rgba(52,211,153,0.4)] disabled:opacity-50">
                <i class="fa-solid fa-circle-notch fa-spin mr-2" x-show="loading" x-cloak></i>
                <span x-text="loading ? 'Authenticating...' : 'Initialize Session'"></span>
            </button>
        </form>

        <div class="mt-8 text-center border-t border-white/10 pt-6">
            <p class="text-sm text-gray-400">
                Unregistered node? 
                <a th:href="@{/register}" class="text-neon-400 hover:text-neon-300 font-semibold ml-1">Create identity</a>
            </p>
            <a th:href="@{/}" class="inline-block mt-4 text-xs text-gray-500 hover:text-gray-300"><i class="fa-solid fa-arrow-left mr-1"></i> Return to nexus</a>
        </div>
    </div>
</body>
</html>
