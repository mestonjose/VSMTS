<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Service - DriveLedger</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">DriveLedger</a>
        <div class="navbar-links">
            <a href="/service-center/dashboard">Dashboard</a>
            <a href="/service-center/records" class="active">Service Records</a>
            <a href="#">Customers</a>
            
            <div class="profile-menu">
                <button class="profile-menu-btn">Profile ▼</button>
                <div class="profile-dropdown">
                    <a href="/profile">Account Settings</a>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit">Sign Out</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <div class="form-page-container">
        <div class="form-page-header">
            <h2>Log Service Record</h2>
            <p style="color: var(--text-secondary); margin-top: 4px;">Record maintenance performed on a customer's vehicle.</p>
        </div>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="form-card">
            <form th:action="@{/service-center/log-service}" method="post">
                <div class="form-group">
                    <label for="vehicleId">Customer Vehicle</label>
                    <select id="vehicleId" name="vehicleId" class="form-control" required>
                        <option value="" disabled selected>Select a vehicle...</option>
                        <option th:each="v : ${vehicles}" th:value="${v.id}"
                                th:text="${v.make + ' ' + v.model + ' (' + v.licensePlate + ') - ' + v.owner.fullName}">Vehicle</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="serviceType">Service Type</label>
                    <select id="serviceType" name="serviceType" class="form-control" required>
                        <option value="" disabled selected>Select type...</option>
                        <option value="Oil Change">Oil Change</option>
                        <option value="Tire Rotation">Tire Rotation</option>
                        <option value="Brake Inspection">Brake Inspection</option>
                        <option value="Engine Tune-Up">Engine Tune-Up</option>
                        <option value="Battery Replacement">Battery Replacement</option>
                        <option value="AC Service">AC Service</option>
                        <option value="General Maintenance">General Maintenance</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="description">Description (Work & Parts Replaced)</label>
                    <textarea id="description" name="description" class="form-control" rows="4" style="resize: vertical; min-height: 80px;" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="serviceDate">Service Date</label>
                    <input type="date" id="serviceDate" name="serviceDate" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="cost">Total Cost (₹)</label>
                    <input type="number" id="cost" name="cost" class="form-control" step="0.01" min="0" required>
                </div>
                
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status" class="form-control" required>
                        <option value="PENDING">Pending</option>
                        <option value="IN_PROGRESS">In Progress</option>
                        <option value="COMPLETED">Completed</option>
                    </select>
                </div>
                
                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <a href="/service-center/dashboard" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Record</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
