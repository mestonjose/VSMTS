<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Invoice - VSMTS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#22c55e', 600: '#16a34a' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="bg-slate-50 min-h-screen">

<!-- Header -->
<header class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between shadow">
    <div class="flex items-center gap-3">
        <i class="fa-solid fa-car-wrench text-brand-500 text-2xl"></i>
        <span class="text-xl font-bold tracking-tight">VSMTS</span>
    </div>
    <a th:href="@{/service-center/dashboard}" class="text-slate-300 hover:text-white text-sm">
        <i class="fa-solid fa-arrow-left mr-1"></i>Back to Dashboard
    </a>
</header>

<main class="max-w-xl mx-auto py-12 px-4">
    <div class="bg-white rounded-2xl shadow p-8">
        <div class="flex items-center gap-3 mb-6">
            <div class="bg-brand-500 text-white rounded-full w-10 h-10 flex items-center justify-center">
                <i class="fa-solid fa-file-invoice"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-800">Upload Invoice</h1>
                <p class="text-sm text-slate-500">Attach an invoice file to this service record</p>
            </div>
        </div>

        <!-- Service Record Info -->
        <div class="bg-slate-50 rounded-lg p-4 mb-6 text-sm">
            <p class="text-slate-600"><span class="font-medium text-slate-800">Service Type:</span>
                <span th:text="${record.serviceType}">Oil Change</span></p>
            <p class="text-slate-600 mt-1"><span class="font-medium text-slate-800">Date:</span>
                <span th:text="${record.serviceDate}">2026-10-01</span></p>
            <p class="text-slate-600 mt-1"><span class="font-medium text-slate-800">Cost:</span>
                ₹<span th:text="${record.cost}">500</span></p>
            <div th:if="${record.invoiceFileName}" class="mt-2 flex items-center gap-2 text-brand-600">
                <i class="fa-solid fa-check-circle"></i>
                <span>Invoice already attached. Upload new to replace.</span>
            </div>
        </div>

        <!-- Error Alert -->
        <div th:if="${error}" class="mb-4 bg-red-50 border border-red-200 rounded-lg p-3 flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation text-red-500"></i>
            <p class="text-sm text-red-700" th:text="${error}">Error message</p>
        </div>

        <!-- Upload Form -->
        <form th:action="@{/service-center/invoice/upload/{id}(id=${record.id})}"
              method="post" enctype="multipart/form-data" class="space-y-5">

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">
                    Invoice File <span class="text-red-500">*</span>
                </label>
                <label class="flex flex-col items-center justify-center w-full h-36 border-2 border-dashed border-slate-300 rounded-xl cursor-pointer hover:border-brand-500 hover:bg-green-50 transition-colors">
                    <div class="flex flex-col items-center gap-2 text-slate-500">
                        <i class="fa-solid fa-cloud-arrow-up text-3xl"></i>
                        <span class="text-sm font-medium">Click to select file</span>
                        <span class="text-xs text-slate-400">PDF, JPG, PNG supported</span>
                    </div>
                    <input type="file" name="invoiceFile" class="hidden" accept=".pdf,.jpg,.jpeg,.png"/>
                </label>
            </div>

            <div class="flex gap-3">
                <button type="submit"
                        class="flex-1 bg-brand-600 hover:bg-brand-500 text-white font-semibold py-2.5 rounded-lg transition-colors">
                    <i class="fa-solid fa-upload mr-2"></i>Upload Invoice
                </button>
                <a th:href="@{/service-center/dashboard}"
                   class="flex-1 text-center border border-slate-300 text-slate-600 hover:bg-slate-50 font-semibold py-2.5 rounded-lg transition-colors">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
